# Activa el perfil `test` para todos los tests del modulo.
#
# Va en .properties y no en .yml a proposito: en el classpath de test hay dos
# resources y gana el primero que se encuentra. Un application.yml de testresources
# SOMBREA el application.yml principal (mismo nombre) y la configuracion completa
# clinics.catedra quedaria vacia. Con nombre distinto, Spring Boot los fusiona:
# las properties tienen prioridad sobre el yaml, pero no lo reemplazan.
#
# El bloque de perfil test del application.yml principal (WireMock en lugar de la
# camara real, Liquibase apagado, sin dependencia de Postgres) ya estaba pensado
# para esto pero nada lo activaba: los tests corrían con los defaults del perfil
# dev, que apuntan a hosts reales.
spring.profiles.active=test
