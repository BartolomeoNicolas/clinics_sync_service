# clinics_sync_service
#
# REGLA DE ESTE ARCHIVO: no contiene ningún secreto. Solo placeholders.
# Los valores reales entran por spring.config.import, desde .env o desde
# ~/.config/clinics/secrets/sync.yml. Ver .env.example.
#
# Criterio de arranque: si falta un secreto requerido, la app NO arranca y el
# error nombra la variable que falta.

spring:
  application:
    name: clinics-sync-service
  profiles:
    default: dev

  kafka:
    # Broker de la catedra. Lo da la catedra en el documento de integracion.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  config:
    import:
      # .env local del repo, leído como properties. "optional" porque el archivo
      # puede no existir: lo que falla después es el placeholder sin default.
      - "optional:file:.env[.properties]"
      # Ubicación canónica, fuera del repo. CLINICS_SECRETS_DIR la sobreescribe.
      - "optional:file:${CLINICS_SECRETS_DIR:${user.home}/.config/clinics/secrets}/sync.yml"
      - "optional:file:${CLINICS_SECRETS_DIR:${user.home}/.config/clinics/secrets}/sync.yaml"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Perfil de desarrollo local.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Sin default a propósito. La validación de clinics.local.db-password es la que
    # hace fallar el arranque nombrando la variable que falta.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinics_sync}
    username: ${DB_USER:sync_app}
    password: ${clinics.local.db-password}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # El esquema es de Liquibase, nunca de Hibernate.
      ddl-auto: none
    open-in-view: false
  liquibase:
    # Aplicado en el arranque. Ver db/changelog/db.changelog-master.xml.
    # OJO: no poner `contexts` acá. En Liquibase eso FILTRA los changesets que
    # no lleven esa etiqueta, en vez de activarlos: la app levanta sin error y
    # no crea ninguna tabla.
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Secretos locales. La validación (@NotBlank) hace que falte uno rompa el arranque.
clinics:
  local:
    db-password: ${DB_PASSWORD:}
  security:
    jwt:
      # Solo la PÚBLICA. Este servicio no emite tokens: los valida.
      # La ruta apunta fuera del repo; la privada nunca está en esta máquina.
      public-key-path: ${CLINICS_JWT_PUBLIC_KEY_PATH:}
      audience: ${CLINICS_JWT_AUDIENCE:clinics-sync}
      issuer: ${CLINICS_JWT_ISSUER:}
      allowed-origins: ${CLINICS_CORS_ALLOWED_ORIGINS:}
  catedra:
    base-url: ${CATEDRA_BASE_URL:http://172.17.201.1:8090}
    group-id: ${CATEDRA_GROUP_ID:nicobartok0-prog2}
    # Vienen de POST /api/student/register. Quedan vacias hasta registrar la cuenta.
    technical-user: ${CATEDRA_TECHNICAL_USER:}
    technical-password: ${CATEDRA_TECHNICAL_PASSWORD:}
    # JWT tecnico que entrego el registro. Opcional: si no esta, o vencio, el
    # adaptador pide uno nuevo con POST /api/authenticate.
    technical-jwt: ${CATEDRA_TECHNICAL_JWT:}
    redis-host: ${CATEDRA_REDIS_HOST:172.17.201.1}
    redis-port: ${CATEDRA_REDIS_PORT:6379}
    redis-username: ${CATEDRA_REDIS_USERNAME:}
    redis-password: ${CATEDRA_REDIS_PASSWORD:}
    # PENDING | PROVISIONED | FAILED | REVOKED
    provisioning-status: ${CATEDRA_PROVISIONING_STATUS:PENDING}

    # Kafka de la catedra. Kafka es notificacion, no fuente de datos: el topic
    # solo avisa que hay una version nueva del catalogo.
    kafka:
      # El consumidor se puede apagar para levantar el servicio sin broker (por
      # ejemplo, en un entorno donde todavia no hay broker de pruebas).
      enabled: ${CATEDRA_KAFKA_ENABLED:true}
      # El groupId de la cuenta tecnica: va en el topic y en el mensaje que
      # publica la catedra.
      group-id: ${CATEDRA_GROUP_ID:nicobartok0-prog2}
      catalog-topic: ${CATEDRA_CATALOG_TOPIC:catedra.catalog.nicobartok0-prog2}
      # Un grupo por servicio: si dos servicios compartieran el grupo, se
      # repartirian los mensajes y cada uno recibiria la mitad.
      consumer-group: ${CATEDRA_CONSUMER_GROUP:clinics-sync}
      # Reintentos con tope ante un error recuperable. Acotados a proposito: un
      # error que se repite no se arregla insistiendo.
      retries: ${CATEDRA_KAFKA_RETRIES:3}
      retry-interval-ms: ${CATEDRA_KAFKA_RETRY_INTERVAL_MS:1000}

logging:
  level:
    com.bartolomeo.clinics: DEBUG

---
# Perfil de tests.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinics_sync_test}
    username: ${DB_USER:sync_app}
    password: ${clinics.local.db-password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

clinics:
  local:
    db-password: ${DB_PASSWORD:}
  catedra:
    # En tests la cátedra se reemplaza por WireMock (PLAN.md §10).
    base-url: http://localhost:${CATEDRA_WIREMOCK_PORT:18080}
    group-id: test-group
    provisioning-status: PROVISIONED
    # Kafka se apaga en los tests: no hay broker y el consumidor solo produciría ruido.
    kafka:
      enabled: false
      group-id: test-group
      catalog-topic: catedra.catalog.test-group
      consumer-group: clinics-sync-test
      retries: 1
      retry-interval-ms: 10

management:
  # En tests no corre ningún Redis (el compose del sync solo levanta Postgres) y el
  # plan prohíbe que un test dependa de Docker (§10). Con el contributor activo,
  # /actuator/health devolvía 503 y los tests de seguridad fallaban por un servicio
  # que no es lo que prueban. En dev y prod el contributor queda tal cual: si Redis
  # está caído, la salud tiene que decirlo.
  health:
    redis:
      enabled: false

logging:
  level:
    com.bartolomeo.clinics: INFO